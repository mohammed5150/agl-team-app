name: Uptime check

# The portal had no uptime monitoring at all: if Netlify or the Supabase
# project went down, the first anyone knew was a team member on shift finding
# they could not file leave — and they would usually assume it was their phone.
#
# This is a low-tech check on purpose. It costs nothing, needs no third-party
# account, and opens a GitHub issue when the portal stops answering, which
# notifies whoever watches the repository. If the team later adopts a proper
# monitor (Better Stack, Pingdom, UptimeRobot all have free tiers that check
# more often and can page a phone), delete this file — see docs/MONITORING.md.

on:
  schedule:
    # Asks for every 15 minutes. DO NOT READ THAT AS THE REAL CADENCE.
    #
    # GitHub's scheduler is best-effort and drops ticks under load, and it
    # drops most of this repo's. Six consecutive observed runs came in at
    # 19:32, 20:24, 21:20, 22:07, 22:56, 23:42 UTC — roughly 45-50 minutes
    # apart, about a third of what the cron asks for. Nothing here can change
    # that; a dependable interval needs a real monitor (docs/MONITORING.md
    # lists free tiers that also page a phone). The comment is here so nobody
    # reasons from "*/15" and concludes the portal is checked four times an
    # hour, or that a 40-minute gap in the run history means something broke.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PORTAL_URL: https://auh-adb-portal.netlify.app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the portal
        id: portal
        run: |
          # Two attempts: a single failed request is far more often a blip in
          # the runner's network than an outage, and a false alarm every few
          # hours is how a monitor gets muted.
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 "$PORTAL_URL" || echo "000")
            if [ "$code" = "200" ]; then break; fi
            echo "attempt $attempt: HTTP $code"
            sleep 15
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" != "200" ]; then
            echo "::error::Portal returned HTTP $code"
            exit 1
          fi

          # A 200 that serves an empty page or a Netlify error page is still an
          # outage as far as the team is concerned, so check the shell actually
          # arrived rather than trusting the status code.
          if ! grep -q 'id="root"' /tmp/body; then
            echo "::error::Portal returned 200 but the app shell is missing"
            exit 1
          fi
          if ! grep -q 'app.js' /tmp/body; then
            echo "::error::Portal returned 200 but does not reference app.js"
            exit 1
          fi

      - name: Check the app bundle is served
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$PORTAL_URL/app.js" || echo "000")
          if [ "$code" != "200" ]; then
            echo "::error::app.js returned HTTP $code — the page would load blank"
            exit 1
          fi

      # -------------------------------------------------------------------
      # THE DEEP CHECK — does the portal actually RUN?
      #
      # Everything above this point passed for the entire time the portal was
      # crashing on every render for every user (the loadAudit temporal-dead-
      # zone fault). It had to: the shell WAS served, it DID contain id="root",
      # app.js DID return 200. The bundle arrived intact and threw the instant
      # the browser evaluated it, and this workflow went on reporting the site
      # healthy while nobody could use it. A monitor that cannot tell "serving
      # files" from "working" is a monitor that will miss the next one too.
      #
      # So this opens the real page in a real browser and insists the app
      # mounted — same assertions CI runs against the build, from
      # scripts/smoke.mjs, so the two cannot drift.
      #
      # Not on every run: it needs a checkout, node and a ~115MB Chromium
      # (cached between runs), perhaps 30s of runner time against ~10s for the
      # curl checks. On every tick that is a few thousand billable minutes a
      # month for a class of fault that only appears at deploy time.
      #
      # WHICH RUNS GO DEEP, AND WHY IT IS NOT A SECOND CRON.
      # This was originally a dedicated `7 * * * *` schedule, gated on
      # github.event.schedule. That was wrong for the reason described at the
      # top of this file: GitHub drops ticks, and a gate keyed to ONE tick is
      # skipped entirely whenever that tick is among the dropped ones — the
      # deep check could then go many hours without running while the workflow
      # kept reporting success. Keying it to the clock instead means whichever
      # run actually happens in the first half of an hour does the deep check,
      # so it survives an arbitrary subset of ticks being dropped.
      # -------------------------------------------------------------------
      - name: Is this a deep-check run?
        id: mode
        run: |
          # 10# forces base 10. date gives a zero-padded minute, and "08"/"09"
          # are invalid octal, so a bare $((minute)) fails for two minutes in
          # every hour — under `bash -e` that would fail the whole check.
          minute=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$minute" -lt 30 ]; then
            deep=true
          else
            deep=false
          fi
          echo "deep=$deep" >> "$GITHUB_OUTPUT"
          echo "minute past the hour: $minute -> deep check: $deep"

      - name: Checkout (deep check)
        if: steps.mode.outputs.deep == 'true'
        uses: actions/checkout@v4

      - name: Node (deep check)
        if: steps.mode.outputs.deep == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache the browser (deep check)
        if: steps.mode.outputs.deep == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install (deep check)
        if: steps.mode.outputs.deep == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Open the portal in a browser
        if: steps.mode.outputs.deep == 'true'
        run: node scripts/smoke.mjs --url "$PORTAL_URL"

      # This step was gated on a `SUPABASE_URL` secret that was never set, and
      # it was written to skip rather than fail when the secret was missing —
      # so every run since it was added has printed "skipping the backend
      # check" and passed. The one thing the monitor most needed to watch (a
      # free-tier project paused after 7 days idle, or a billing lapse) was
      # never being watched at all, and the run still went green.
      #
      # The gate was unnecessary in the first place: the project URL is not a
      # secret. It is committed in src/supabasePortal.js, compiled into
      # dist/app.js, and served to anyone who loads the portal signed-out —
      # index.html's own CSP names *.supabase.co. So default to the real URL
      # and let a secret override it if the project ever moves. No key is
      # involved: the check is a deliberately UNAUTHENTICATED request.
      - name: Check Supabase is answering
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vzipsbecmirbkrbrpcdt.supabase.co' }}
        run: |
          echo "Checking $SUPABASE_URL"
          # /rest/v1/ without a key answers 401. That is a HEALTHY response:
          # it proves PostgREST is up and rejecting properly. A paused project
          # gives 503 or a connection failure instead.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$SUPABASE_URL/rest/v1/" || echo "000")
          case "$code" in
            200|401|404) echo "Supabase reachable (HTTP $code)" ;;
            *) echo "::error::Supabase returned HTTP $code — the project may be paused"; exit 1 ;;
          esac

      - name: Open an issue if the portal is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Portal uptime check failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Reuse the open issue rather than filing one every 15 minutes —
            // an alert channel that floods is an alert channel that gets muted.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });

            const body = [
              `The uptime check failed at ${new Date().toISOString()}.`,
              "",
              `- Run: ${run}`,
              `- Portal: ${process.env.PORTAL_URL}`,
              "",
              "**First things to check**",
              "1. Read the run log above — it says WHICH check failed, and they mean different things.",
              "   A `[smoke]` failure means the site is serving files correctly but the app does not",
              "   run: open the portal yourself and look at the browser console. That is a code fault",
              "   in the last deploy, not an infrastructure problem, and a rollback is the fast fix.",
              "2. Is the Supabase project paused? (billing, or 7-day inactivity on free tier)",
              "3. Did the last Netlify deploy fail?",
              "4. Is Supabase or Netlify reporting an incident?",
              "",
              "Recovery steps: `docs/BACKUP_RESTORE.md`. Monitoring: `docs/MONITORING.md`.",
            ].join("\n");

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing — ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime"],
              });
            }

      - name: Close the issue once it recovers
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — the portal is answering again as of ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
